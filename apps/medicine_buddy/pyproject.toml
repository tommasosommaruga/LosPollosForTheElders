[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicine-buddy"
version = "0.1.0"
description = "Reachy Mini + Maker Arm medicine reminder and dispense MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
medicine-buddy = "medicine_buddy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["medicine_buddy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
